apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop-dev
  labels:
    pro: roboshop
    component: mongodb
    tier: db

spec:
  replicas: 1
  selector:
    matchLabels:
      pro: roboshop
      component: mongodb
      tier: db

  template:
    metadata:
      labels:
        pro: roboshop
        component: mongodb
        tier: db

    spec:
      containers:
        - name: mongodb
          image: veenay910/mongo-init-image:11